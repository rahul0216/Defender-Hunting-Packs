id: c2eb0f60-2333-4790-bec0-d1972d50a303
name: TeamPCP threat actor runner memory and secret sweep signals
description: |
  Detects runner process targeting and broad filesystem secret sweep behavior associated with TeamPCP tooling.
description-detailed: |
  This hunt identifies commands that target runner memory, process enumeration,
  and broad access to common secret locations and files.
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceProcessEvents
tactics:
  - CredentialAccess
  - Collection
relevantTechniques:
  - T1003
  - T1552
  - T1056
tags:
  - TeamPCP
  - CI runners
  - Secret sweep
query: |
  let StartTime = ago(1d);
  let EndTime = now();
  let RunnerPatterns = dynamic([
    "pgrep -f Runner.Worker", "pgrep -f Runner.Listener", "/proc/", "/mem",
    "isSecret", "~/.ssh", "~/.npmrc", ".env", "terraform.tfstate", "/var/log/auth.log"
  ]);
  DeviceProcessEvents
  | where TimeGenerated between (StartTime .. EndTime)
  | where isnotempty(ProcessCommandLine)
  | where ProcessCommandLine has_any (RunnerPatterns)
  | summarize EventCount=count(), FirstSeen=min(TimeGenerated), LastSeen=max(TimeGenerated),
              SampleCommands=make_set(ProcessCommandLine, 20),
              ParentProcesses=make_set(InitiatingProcessParentFileName, 20)
      by DeviceName, DeviceId, AccountName, InitiatingProcessFileName
  | extend TimeGenerated = FirstSeen
  | order by EventCount desc, TimeGenerated desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
version: 1.0.0
