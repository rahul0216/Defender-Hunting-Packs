id: 0495c8e2-df73-4634-b2fe-88bdc1542d02
name: TeamPCP threat actor credential harvest command patterns
description: |
  Detects command-line patterns consistent with TeamPCP credential and secret collection behavior.
description-detailed: |
  This hunt identifies process command lines that indicate cloud credential scraping,
  Kubernetes secret enumeration, and broad environment harvesting.
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceProcessEvents
tactics:
  - CredentialAccess
  - Discovery
relevantTechniques:
  - T1552
  - T1552.005
  - T1552.007
  - T1087
tags:
  - TeamPCP
  - Credential theft
  - Cloud secrets
query: |
  let StartTime = ago(1d);
  let EndTime = now();
  let SuspiciousPatterns = dynamic([
    "grep AWS_", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "169.254.169.254",
    "169.254.170.2", "kubectl get secrets --all-namespaces", "printenv",
    "$GOOGLE_APPLICATION_CREDENTIALS", "grep -i azure", "az account get-access-token",
    "Get-AzAccessToken", "gh auth token", "wg showconf all", "/run/secrets/kubernetes.io/serviceaccount"
  ]);
  DeviceProcessEvents
  | where TimeGenerated between (StartTime .. EndTime)
  | where isnotempty(ProcessCommandLine)
  | where ProcessCommandLine has_any (SuspiciousPatterns)
  | extend MatchedPattern = extract(@"(?i)(grep AWS_|AWS_CONTAINER_CREDENTIALS_RELATIVE_URI|169\.254\.169\.254|169\.254\.170\.2|kubectl get secrets --all-namespaces|printenv|\$GOOGLE_APPLICATION_CREDENTIALS|grep -i azure|az account get-access-token|Get-AzAccessToken|gh auth token|wg showconf all|/run/secrets/kubernetes\.io/serviceaccount)", 1, ProcessCommandLine)
  | summarize EventCount=count(), FirstSeen=min(TimeGenerated), LastSeen=max(TimeGenerated),
              MatchedPatterns=make_set(MatchedPattern, 30),
              SampleCommands=make_set(ProcessCommandLine, 20)
      by DeviceName, DeviceId, AccountName, InitiatingProcessFileName, InitiatingProcessParentFileName
  | extend TimeGenerated = FirstSeen
  | order by EventCount desc, TimeGenerated desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
version: 1.0.0
