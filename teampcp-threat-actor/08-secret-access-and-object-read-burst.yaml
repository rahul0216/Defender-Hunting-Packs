id: c17f0840-2708-45c3-8bc6-4fdc8f86da08
name: TeamPCP threat actor secret access and object read burst
description: |
  Detects high-volume secret access and object read patterns that can indicate bulk data collection.
description-detailed: |
  This hunt identifies bursts of secret retrieval and object-read activity from single
  identities or source IPs over short intervals.
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - CloudAppEvents
tactics:
  - Collection
  - Exfiltration
relevantTechniques:
  - T1530
  - T1552
  - T1041
tags:
  - TeamPCP
  - Secret access
  - Data collection
query: |
  let StartTime = ago(1d);
  let EndTime = now();
  let SecretOrDataActions = dynamic([
    "GetSecretValue", "BatchGetSecretValue", "ListSecrets", "GetParameter",
    "GetObject", "ListObjects", "GetBlob", "GetFile", "Download", "Read"
  ]);
  CloudAppEvents
  | where TimeGenerated between (StartTime .. EndTime)
  | extend Action = tostring(column_ifexists("ActionType", ""))
  | where Action has_any (SecretOrDataActions)
  | extend Identity = coalesce(
      tostring(column_ifexists("AccountDisplayName", "")),
      tostring(column_ifexists("AccountObjectId", "")),
      tostring(column_ifexists("UserId", "unknown"))
    )
  | extend SrcIp = coalesce(tostring(column_ifexists("IPAddress", "")), tostring(column_ifexists("IP", "")))
  | summarize AccessEvents=count(), DistinctActions=dcount(Action),
              FirstSeen=min(TimeGenerated), LastSeen=max(TimeGenerated),
              Actions=make_set(Action, 30), SrcIps=make_set(SrcIp, 20)
      by bin(TimeGenerated, 30m), Identity
  | where AccessEvents >= 15 or (AccessEvents >= 8 and DistinctActions >= 4)
  | order by AccessEvents desc, TimeGenerated desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: Identity
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIp
version: 1.0.0
